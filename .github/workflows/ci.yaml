name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu/latest

    steps:
      - name: Checkout repository
        uses: action/checkout@v4
      
      - name: Build Docker image
        run: |
          docker build -t app-ci ./app

      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name app_ci_container app-ci
      
      - name: Wait for app
        run: |
          sleep 5

      - name: Health check
        run: |
          curl http://localhost:5000/health

      - name: Stop container
        if: always()
        run: |
          docker stop app_ci_container
          docker rm app_ci_container