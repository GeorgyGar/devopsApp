version: "3.9"

services:
    app:
      build: ./app
      container_name: devops_app
      ports:
        - "5000:5000"

    nginx:
      build: ./nginx
      container_name: devops_nginx
      ports:
        - "80:80"
      depends_on:
        - app

    prometheus:
      image: prom/prometheus
      container_name: devops_prometheus
      volumes:
        - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml
      ports:
        - "9090:9090"
      depends_on:
        - app

    grafana:
      image: grafana/grafana
      container_name: devops_grafana
      ports:
        - "3000:3000"
      depends_on:
        - prometheus